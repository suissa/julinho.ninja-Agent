version: '3.8'

services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: chatbot-rabbitmq
    hostname: rabbitmq
    ports:
      - "${DOCKER_RABBITMQ_PORT:-5672}:5672"
      - "${DOCKER_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # WhatsApp Multi-Agent Chatbot
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: whatsapp-chatbot
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"  # Health check port
      - "9090:9090"  # Metrics port
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      SESSION_PERSISTENCE_ENABLED: ${SESSION_PERSISTENCE_ENABLED:-true}
      SESSION_STORAGE_PATH: /app/sessions
      MIN_MESSAGE_INTERVAL: ${MIN_MESSAGE_INTERVAL:-2000}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-1800000}
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS:-3}
    volumes:
      - chatbot_sessions:/app/sessions
      - chatbot_logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Optional: Redis for session storage (alternative to file-based)
  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - redis

volumes:
  rabbitmq_data:
    driver: local
  chatbot_sessions:
    driver: local
  chatbot_logs:
    driver: local
  redis_data:
    driver: local

networks:
  chatbot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16